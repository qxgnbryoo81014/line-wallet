name = "line-wallet"
main = "src/index.ts"
compatibility_date = "2025-11-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "line-wallet"
database_id = "REPLACE_WITH_YOUR_D1_ID"  # wrangler d1 create line-wallet

# 機密用 wrangler secret put 設定，不寫在這裡：
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN
